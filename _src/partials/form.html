<form action="https://formsubmit.co/info@truepaintingmn.com" method="POST" class="estimate-form">
  <input type="hidden" name="_subject" value="New estimate request - True Painting MN">
  <input type="hidden" name="_template" value="table">
  <input type="hidden" name="_captcha" value="false">
  <input type="hidden" name="_next" value="https://truepaintingmn.com/thank-you">
  <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off" aria-hidden="true">

  <label>
    <span>Your name</span>
    <input type="text" name="Name" placeholder="First and last name" autocomplete="name" required>
  </label>
  <label>
    <span>Phone</span>
    <input type="tel" name="Phone" placeholder="(555) 555-5555" autocomplete="tel" required>
  </label>
  <label>
    <span>Email <span style="opacity:.6;font-weight:400">(optional)</span></span>
    <input type="email" name="Email" placeholder="you@example.com" autocomplete="email">
  </label>
  <label>
    <span>City or address</span>
    <input type="text" name="Location" placeholder="e.g. Plymouth, MN" autocomplete="address-level2" required>
  </label>
  <label>
    <span>What would you like painted?</span>
    <textarea name="Project details" rows="3" placeholder="e.g. Living room and hallway walls, plus the trim in both" required></textarea>
  </label>
  <label>
    <span>When are you hoping to have it done?</span>
    <select name="Timeline">
      <option value="As soon as possible">As soon as possible</option>
      <option value="Within a few weeks" selected>Within a few weeks</option>
      <option value="Next month or two">Next month or two</option>
      <option value="Just planning ahead">Just planning ahead</option>
    </select>
  </label>
  <label>
    <span>Best way to reach you</span>
    <select name="Preferred contact">
      <option value="Text">Text message</option>
      <option value="Call">Phone call</option>
      <option value="Email">Email</option>
    </select>
  </label>
  <button type="submit" class="btn btn--primary">Request my free estimate</button>
  <p class="disclaimer" style="color:rgba(255,255,255,0.62); margin:14px 0 0;">
    No cost, no obligation, and I won't pester you. Your details are only used to get back to you about your project.
  </p>
</form>
